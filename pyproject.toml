[build-system]
requires = ["setuptools>=61"]   # , "setuptools-scm", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "Bandit"
description = "A set of command-line tools for extracting model subsets from the National Hydrologic Model parameter database"
readme = "README.rst"
dynamic = ["version"]
requires-python = ">=3.10,<3.15"
license = {file = "LICENSE"}
authors = [{name = "Parker Norton", email = "pnorton@usgs.gov"}, ]
maintainers = [{name = "Parker Norton", email = "pnorton@usgs.gov"}, ]
keywords = ["PRMS", "NHM", "streamflow", "hydrology", "surface"]
classifiers = ["Development Status :: 3 - Alpha",
               "Programming Language :: Python :: 3", ]

dependencies = ["cyclopts",
    "dask",
    "gdal>=3",
    "netcdf4!=1.7.4",
    "networkx>=2",
    "numpy",
    "pandas",
    "plotly",
    # pyPRMS is the companion PRMS model file I/O library developed alongside
    # Bandit by the USGS. It is required at runtime (imported throughout) but is
    # distributed separately rather than via PyPI, so it is typically installed
    # from source (e.g. pip install -e) into the same environment.
    "pyPRMS",
    "pyogrio>=0.4.2",
    "pyyaml",
    "rich",
    "ruamel.yaml",
    "setuptools",
    "xarray",
    "zarr", ]

[project.optional-dependencies]
dev = ["hypothesis",
       "mypy",
       "mypy_extensions",
       "pytest",
       "pytest-cov",
       "pytest-xdist",]

[project.urls]
Repository = "https://github.com/paknorton/Bandit.git"

[project.scripts]
bandit = "Bandit.bandit:main"
bandit_by_streamgage = "Bandit.bandit_by_streamgage:main"
bandit_multi_locations = "Bandit.bandit_multi_locations:main"
bandit_single_hru = "Bandit.bandit_single_hru:main"
create_bandit_job = "Bandit.utilities.create_bandit_job:main"
config_tool = "Bandit.utilities.config_tool:main"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov=Bandit --cov-report=term-missing --cov-report=xml:coverage.xml"
testpaths = ["tests"]

[tool.coverage.run]
source = ["Bandit"]
branch = true
omit = ["*/src/netCDF4/_netCDF4.pyx", ]

[tool.coverage.report]
omit = ["*/src/netCDF4/_netCDF4.pyx", ]
show_missing = true
skip_covered = false
precision = 1

[tool.setuptools]
include-package-data = false
zip-safe = false

[tool.setuptools.dynamic]
version = {attr = "Bandit.version.__version__"}

[tool.setuptools.packages.find]
include = ["Bandit", "Bandit.*"]

#[tool.setuptools.package-data]
#"pyPRMS.xml" = ["*.xml"]