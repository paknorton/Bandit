[build-system]
requires = ["setuptools>=61"]   # , "setuptools-scm", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "Bandit"
description = "A set of command-line tools for extracting model subsets from the National Hydrologic Model parameter database"
readme = "README.rst"
dynamic = ["version"]
requires-python = ">=3.10,<3.15"
license = {file = "LICENSE"}
authors = [{name = "Parker Norton", email = "pnorton@usgs.gov"}, ]
maintainers = [{name = "Parker Norton", email = "pnorton@usgs.gov"}, ]
keywords = ["PRMS", "NHM", "streamflow", "hydrology", "surface"]
classifiers = ["Development Status :: 4 - Beta",
               "Programming Language :: Python :: 3", ]

dependencies = ["cyclopts",
    "dask",
    "gdal>=3",
    "netcdf4!=1.7.4",
    "networkx>=2",
    "numpy",
    "pandas",
    "plotly",
    # pyPRMS is the companion PRMS model file I/O library developed alongside
    # Bandit by the USGS. It is required at runtime (imported throughout) but is
    # distributed separately rather than via PyPI, so it is typically installed
    # from source (e.g. pip install -e) into the same environment.
    "pyPRMS",
    "pyogrio>=0.4.2",
    "pyyaml",
    "rich",
    "ruamel.yaml",
    "setuptools",
    "xarray",
    "zarr", ]

[project.optional-dependencies]
dev = ["hypothesis",
       "mypy",
       "mypy_extensions",
       "pytest",
       "pytest-cov",
       "pytest-xdist",]

[project.urls]
Repository = "https://github.com/paknorton/Bandit.git"

[project.scripts]
bandit = "Bandit.bandit:main"
bandit_by_streamgage = "Bandit.bandit_by_streamgage:main"
bandit_multi_locations = "Bandit.bandit_multi_locations:main"
bandit_single_hru = "Bandit.bandit_single_hru:main"
create_bandit_job = "Bandit.utilities.create_bandit_job:main"
config_tool = "Bandit.utilities.config_tool:main"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov=Bandit --cov-report=term-missing --cov-report=xml:coverage.xml"
testpaths = ["tests"]
filterwarnings = [
    # Cartopy 0.26 deprecated the module-level LONGITUDE_FORMATTER /
    # LATITUDE_FORMATTER attributes; the warning is emitted by the companion
    # pyPRMS library on import, not by Bandit. Silence it here until pyPRMS is
    # updated to use LongitudeFormatter / LatitudeFormatter.
    "ignore:The (LONGITUDE|LATITUDE)_FORMATTER module-level attribute was deprecated:DeprecationWarning",
]

[tool.mypy]
python_version = "3.10"

# Several runtime dependencies ship no type information. Rather than scatter
# per-import "# type: ignore" comments, silence the missing-stub errors for
# those third-party packages here.
[[tool.mypy.overrides]]
module = ["osgeo.*", "pyPRMS.*"]
ignore_missing_imports = true

# The modules below are thin wrappers around dynamically-typed scientific
# libraries (pandas, xarray, netCDF4, GDAL/OGR). mypy cannot follow the runtime
# types those libraries return (e.g. a pandas DatetimeIndex surfaced as a bare
# Index, or xarray open_* returning Dataset | None), so it reports errors on
# code that is correct at run time. Relax checking for just these data-plumbing
# modules; the core extraction/CLI modules remain strictly checked.
[[tool.mypy.overrides]]
module = [
    "Bandit.WDFN",
    "Bandit.dynamic_parameters",
    "Bandit.model_output",
    "Bandit.points_of_interest",
    "Bandit.prms_geo",
]
disable_error_code = [
    "attr-defined",
    "union-attr",
    "index",
    "return-value",
    "arg-type",
    "assignment",
    "call-overload",
    "operator",
    "dict-item",
    "func-returns-value",
]

[tool.coverage.run]
source = ["Bandit"]
branch = true
omit = ["*/src/netCDF4/_netCDF4.pyx", ]

[tool.coverage.report]
omit = ["*/src/netCDF4/_netCDF4.pyx", ]
show_missing = true
skip_covered = false
precision = 1

[tool.setuptools]
include-package-data = false
zip-safe = false

[tool.setuptools.dynamic]
version = {attr = "Bandit.version.__version__"}

[tool.setuptools.packages.find]
include = ["Bandit", "Bandit.*"]

#[tool.setuptools.package-data]
#"pyPRMS.xml" = ["*.xml"]